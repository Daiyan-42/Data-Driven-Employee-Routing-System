# One compose file for local builds and the Azure VM.
#
# Local (builds Dockerfiles, uses backend/.env):
#   docker compose up --build -d
#   open http://localhost   (or http://localhost:8080 if you set HTTP_PORT=8080)
#
# Azure VM (pulls ghcr.io/saon110 images, uses /opt/dders/.env.production):
#   docker compose pull && docker compose up -d
#
# Only a push to Saon110/main publishes those images and deploys.

services:

  backend:
    image: ghcr.io/saon110/dders-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
      - path: backend/.env
        required: false
    environment:
      ROUTING_ENGINE: lightweight
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      ROOT_PATH: /api
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/saon110/dders-frontend:latest
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
