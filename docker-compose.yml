services:

  backend:
    image: ghcr.io/daiyan-42/dders-backend:latest
    restart: unless-stopped
    env_file:
      # On the VM, create /opt/dders/.env.production with the 3 secrets.
      # See README-deploy.md for the format.
      - .env.production
    environment:
      ROUTING_ENGINE: lightweight       # no OSRM needed; haversine fallback
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/daiyan-42/dders-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
